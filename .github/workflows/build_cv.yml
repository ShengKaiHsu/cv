name: Generate CV from ORCID

on:
  schedule:
    - cron: '0 0 1 * *'  # 00:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install pandoc texlive-xetex -y

      - name: Generate CV
        run: python generate_cv.py

      - name: Convert to PDF and DOCX
        run: |
          pandoc cv.md \
           -V geometry:top=1.5cm,bottom=1.5cm,left=1.5cm,right=1.5cm \
          -o cv.pdf
          pandoc cv.md \
           -V geometry:top=1.5cm,bottom=1.5cm,left=1.5cm,right=1.5cm \
          -o cv.docx

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add cv.md cv.pdf cv.docx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update CV"
            git push
          fi
